name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: edumanagepro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d edumanagepro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: Backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app

      - name: Run domain tests
        run: python test_sprint2.py

      # Chaque suite E2E migre son propre schema via Alembic puis teste son
      # module : les faire toutes tourner sur le service PostgreSQL est le
      # seul moyen de detecter une regression de migration avant le deploi.
      # Les suites qui en ont besoin lisent TEST_DATABASE_URL ; les autres
      # restent sur leur SQLite isole, selon leur conception.
      - name: Run E2E suites (PostgreSQL)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/edumanagepro_test
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/edumanagepro_test
        run: |
          suites=(
            test_sprint3_e2e.py
            test_academic_e2e.py
            test_auth_lot2_e2e.py
            test_bulletins_lot_e2e.py
            test_deliberation_e2e.py
            test_documents_e2e.py
            test_etudiant_import_e2e.py
            test_export_e2e.py
            test_import_notes_e2e.py
            test_institution_e2e.py
            test_matricule_e2e.py
            test_paiements_en_ligne_e2e.py
            test_rbac_e2e.py
            test_relances_e2e.py
            test_salles_conflits_e2e.py
            test_semestre_e2e.py
          )
          echec=0
          for suite in "${suites[@]}"; do
            echo "::group::$suite"
            if ! python "$suite"; then
              echo "::error file=Backend/$suite::Suite E2E en echec"
              echec=1
            fi
            echo "::endgroup::"
          done
          exit $echec

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build production bundle
        run: npm run build
